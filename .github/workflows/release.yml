name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.0.1-beta)'
        required: true
        default: 'v0.0.1-beta'

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create GitHub Beta Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename Release APK
        run: |
          mkdir -p release-output
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          fi
          cp app/build/outputs/apk/release/app-release.apk release-output/hshop-thor-${TAG_NAME}.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hshop-thor-apk
          path: release-output/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          name: ${{ github.ref_name || github.event.inputs.version }} (Beta)
          draft: false
          prerelease: true
          generate_release_notes: true
          files: release-output/*.apk
